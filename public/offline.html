<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0867d8">
  <title>Sin conexión · Misión Cristiana Shalom</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#f5f9ff;color:#102a43;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,420px);padding:38px 28px;text-align:center;background:#fff;border:1px solid #dbe8f5;border-radius:24px;box-shadow:0 20px 60px #0867d816}.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:30px;text-align:left}.brand img{width:64px;height:64px;border-radius:16px}.brand strong{display:block;color:#0867d8;font-size:22px;line-height:1}.brand small{display:block;margin-bottom:6px;color:#60758b;font-size:8px;font-weight:800;letter-spacing:1.4px}.card h1{margin:0 0 12px;font-size:25px}.card p{margin:0;color:#60758b;line-height:1.65}.card button{margin-top:26px;padding:13px 22px;border:0;border-radius:11px;background:#0867d8;color:#fff;font:700 14px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/branding/shalom-icon.png" alt=""><span><small>MISIÓN CRISTIANA</small><strong>SHALOM</strong></span></div>
    <h1>Estás sin conexión</h1>
    <p>La Biblia que ya abriste puede seguir disponible. Para sincronizar nuevos datos, vuelve a conectarte a internet.</p>
    <button onclick="location.reload()">Intentar de nuevo</button>
  </main>
</body>
</html>
